* { box-sizing: border-box; }

"col":"route_id","parent":"routes","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trip_operations","col":"booking_trip_id","parent":"booking_trips","pcol":"id","enforced":true,"childEnd":"zeroOrOne","parentEnd":"one"},{"child":"booking_trip_lock_draws","col":"booking_trip_id","parent":"booking_trips","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trip_lock_draws","col":"seat_lock_id","parent":"seat_locks","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trips","col":"ovn_of","parent":"booking_trips","pcol":"id","enforced":true,"childEnd":"zeroOrOne","parentEnd":"zeroOrOne"},{"child":"van_day_routes","col":"van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"van_day_routes","col":"route_id","parent":"routes","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"van_status_ranges","col":"van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"van_days","col":"van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"van_groups","col":"route_id","parent":"routes","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"van_groups","col":"van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"van_groups","col":"return_van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"booking_trip_van_allocations","col":"booking_trip_id","parent":"booking_trips","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trip_van_allocations","col":"van_group_id","parent":"van_groups","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"booking_trip_van_allocations","col":"return_van_id","parent":"vans","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"market_subs","col":"market_id","parent":"markets","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"agents","col":"market_id","parent":"markets","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"agents","col":"sales_id","parent":"sales_people","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"agent_programs","col":"agent_id","parent":"agents","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"agent_programs","col":"route_id","parent":"routes","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"agent_activity","col":"agent_id","parent":"agents","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_addons","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_history","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_cancellations","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrOne","parentEnd":"one"},{"child":"booking_reschedules","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_partial_cancels","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_fee_items","col":"booking_id","parent":"bookings","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trips","col":"charter_boat_id","parent":"boats","pcol":"id","enforced":false,"reason":"The real rule, \"deployed on this route that day\", is stronger than a key, and both stores check it before writing (014).","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"deployments","col":"boat_id","parent":"boats","pcol":"id","enforced":false,"reason":"Left out for the same reason. 014 says it and `charter_boat_id` \"should gain a key together\".","childEnd":"zeroOrMany","parentEnd":"one"},{"child":"deployments","col":"route_id","parent":"routes","pcol":"id","enforced":false,"reason":"Created (001) before the route catalogue existed (005). 008 added a key for `booking_trips.route_id` only.","childEnd":"zeroOrMany","parentEnd":"one"},{"child":"seat_locks","col":"route_id","parent":"routes","pcol":"id","enforced":false,"reason":"Same as `deployments.route_id`.","childEnd":"zeroOrMany","parentEnd":"one"},{"child":"booking_trip_operations","col":"boat_id","parent":"boats","pcol":"id","enforced":false,"reason":"Created without one (013). No API writes the column yet.","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"bookings","col":"agent_id","parent":"agents","pcol":"id","enforced":false,"reason":"Created (002) before the agents table (017). No key was added when it arrived.","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"seat_locks","col":"agent_id","parent":"agents","pcol":"id","enforced":false,"reason":"Same as `bookings.agent_id`.","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"booking_partial_cancels","col":"booking_trip_id","parent":"booking_trips","pcol":"id","enforced":false,"reason":"Deliberate: the record must outlive a trip a later edit removes (020).","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"boat_capacity_overrides","col":"boat_id","parent":"deployments","pcol":"boat_id","reason":"An override applies to the deployment of the same boat on the same day. The two are matched on `boat_id` and `service_date`; no key links them.","enforced":false,"join":true,"childEnd":"zeroOrOne","parentEnd":"zeroOrOne"},{"child":"rate_types","col":"owner_sales_id","parent":"sales_people","pcol":"id","enforced":true,"childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"rate_type :"rate_types","pcol":"id","enforced":false,"reason":"Created (017) before the rate types table (022). The key can only ship after the rate types import has run in production; until then agents hold ids `rate_types` does not have (`todo/rate-types-model.md`).","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"},{"child":"bookings","col":"rate_type_ref","parent":"rate_types","pcol":"id","enforced":false,"reason":"Free text for good: it is a historical snapshot, and a deleted rate must not break old bookings (`todo/rate-types-model.md`).","childEnd":"zeroOrMany","parentEnd":"zeroOrOne"}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('schema-data').textContent);
  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), sizer = $('sizer'), inner = $('inner'), svg = $('lines'), panel = $('panel');
  const search = $('search'), allLines = $('all-lines');
  const SVG = 'http://www.w3.org/2000/svg';

  const el = (tag, attrs = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs)) {
      if (key === 'class') node.className = value;
      else if (key === 'text') node.textContent = value;
      else node.setAttribute(key, value);
    }
    for (const kid of kids) if (kid !== null && kid !== undefined) node.append(kid);
    return node;
  };
  const svgEl = (tag, attrs) => { const node = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v); return node; };
  /** Text with `code` spans, as the reasons in docs/schema.md are written. Never parsed as HTML. */
  const inline = (text) => { const out = document.createDocumentFragment(); text.split('`').forEach((part, i) => out.append(i % 2 ? el('code', { text: part }) : part)); return out; };

  const areas = Object.fromEntries(data.areas.map((a) => [a.id, a]));
  const cards = new Map();
  const rows = new Map();
  const relsOf = new Map(Object.keys(data.tables).map((t) => [t, []]));
  data.rels.forEach((r, i) => { r.i = i; relsOf.get(r.child).push(r); if (r.parent !== r.child) relsOf.get(r.parent).push(r); });

  let scale = 1, autoFit = true, hover = null, selected = null, hits = null;

  $('meta').textContent = `${Object.keys(data.tables).length} tables · ${data.rels.length} links · ${data.source}`;

  // ── Cards ──
  function columnRow(table, c) {
    const keys = el('span', { class: 'keys' });
    if (c.pk) keys.append(el('b', { class: 'k pk', text: 'PK' }));
    if (c.fk) keys.append(el('b', { class: 'k fk', text: 'FK' }));
    if (c.ref) keys.append(el('b', { class: 'k ref', text: 'ref' }));
    if (c.uk) keys.append(el('b', { class: 'k uk', text: 'UK' }));
    const row = el('div', { class: 'row' + (c.note ? ' has-note' : ''), title: c.note ? `${c.name}: ${c.note}` : c.name },
      keys, el('span', { class: 'col', text: c.name }), el('span', { class: 'type', text: c.type }));
    rows.set(`${table}.${c.name}`, row);
    return row;
  }

  function card(name) {
    const t = data.tables[name];
    const node = el('article', { class: 'card', tabindex: '0', style: `--area: var(--a-${t.area})`, 'aria-label': `Table ${name}` },
      el('header', { class: 'card-head' }, el('span', { class: 'card-name', text: name }), el('span', { class: 'card-count', text: `${t.columns.length} cols` })));
    for (const c of t.columns) if (!c.group) node.append(columnRow(name, c));
    for (const group of t.groups) {
      const members = t.columns.filter((c) => c.group === group);
      const body = el('div', { hidden: '' });
      for (const c of members) body.append(columnRow(name, c));
      const toggle = el('button', { class: 'group', type: 'button', 'aria-expanded': 'false' },
        el('span', { class: 'chev', text: '▸' }), el('span', { text: group }), el('span', { class: 'group-n', text: String(members.length) }));
      toggle.addEventListener('click', (event) => { event.stopPropagation(); openGroup(toggle, body, body.hidden); });
      node.append(toggle, body);
    }
    node.addEventListener('mouseenter', () => { hover = name; applyFocus(); });
    node.addEventListener('mouseleave', () => { hover = null; applyFocus(); });
    node.addEventListener('click', (event) => { event.stopPropagation(); select(name); });
    node.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(name); } });
    cards.set(name, node);
    return node;
  }

  /** `auto` marks a group the search opened, so the search may close it again; a click claims it. */
  function setGroup(toggle, open, auto) {
    const body = toggle.nextElementSibling;
    body.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    if (open && auto) toggle.dataset.auto = '1'; else delete toggle.dataset.auto;
  }
  function openGroup(toggle, body, open) { setGroup(toggle, open, false); relayout(); }

  for (const area of data.areas) {
    const tracks = el('div', { class: 'tracks' });
    for (const track of area.tracks) tracks.append(el('div', { class: 'track' }, ...track.map(card)));
    inner.append(el('section', { class: 'lane', style: `--area: var(--a-${area.id})` },
      el('header', { class: 'lane-head' }, el('h2', { text: area.name }), el('p', { text: area.blurb })), tracks));
  }

  // ── Lines ──
  /** A box in the canvas's own, unscaled coordinates. */
  function box(node) {
    const r = node.getBoundingClientRect(), base = inner.getBoundingClientRect();
    return { l: (r.left - base.left) / scale, r: (r.right - base.left) / scale, t: (r.top - base.top) / scale, b: (r.bottom - base.top) / scale };
  }
  /** The column's row, or the card's header when the row is folded away inside a group. */
  const anchor = (table, column) => { const row = rows.get(`${table}.${column}`); return row && row.offsetParent !== null ? row : cards.get(table).firstChild; };

  /** Line-end symbols in crow's-foot notation, drawn outward from the card edge at (x, y). */
  function ending(g, x, y, dir, kind) {
    const at = (dx) => x + dir * dx;
    const stroke = (d) => g.append(svgEl('path', { d, class: 'mark' }));
    const bar = (dx) => stroke(`M${at(dx)},${y - 6} V${y + 6}`);
    const ring = (dx) => g.append(svgEl('circle', { cx: at(dx), cy: y, r: 3.6, class: 'ring' }));
    const crow = () => stroke(`M${at(0)},${y - 6} L${at(11)},${y} M${at(0)},${y + 6} L${at(11)},${y} M${at(0)},${y} H${at(11)}`);
    if (kind === 'one') { bar(5); bar(10); }
    else if (kind === 'zeroOrOne') { bar(5); ring(14); }
    else if (kind === 'oneOrMore') { crow(); bar(15); }
    else { crow(); ring(18); }
  }

  function draw() {
    const w = inner.offsetWidth, h = inner.offsetHeight;
    svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.replaceChildren();
    for (const r of data.rels) {
      const from = box(cards.get(r.child)), to = box(cards.get(r.parent));
      const a = box(anchor(r.child, r.col)), b = box(anchor(r.parent, r.pcol));
      const y1 = (a.t + a.b) / 2, y2 = (b.t + b.b) / 2;
      // Leave each card on the side facing the other; cards stacked in one track loop out to the right.
      let s1 = 1, s2 = 1;
      if (r.child !== r.parent && to.l >= from.r - 1) s2 = -1;
      else if (r.child !== r.parent && to.r <= from.l + 1) s1 = -1;
      const x1 = s1 > 0 ? from.r : from.l, x2 = s2 > 0 ? to.r : to.l;
      let d;
      if (s1 === s2) {
        const out = Math.max(x1, x2) + 26 + Math.min(80, Math.abs(y2 - y1) * 0.1);
        d = `M${x1},${y1} C${out},${y1} ${out},${y2} ${x2},${y2}`;
      } else {
        const pull = Math.max(36, Math.abs(x2 - x1) * 0.45);
        d = `M${x1},${y1} C${x1 + s1 * pull},${y1} ${x2 + s2 * pull},${y2} ${x2},${y2}`;
      }
      const g = svgEl('g', { class: 'rel' + (r.enforced ? '' : ' loose'), 'data-i': r.i });
      g.append(svgEl('path', { d, class: 'wire' }));
      ending(g, x1, y1, s1, r.childEnd);
      ending(g, x2, y2, s2, r.parentEnd);
      svg.append(g);
    }
    applyFocus();
  }

  // ── Focus: hover, selection, search ──
  const neighbours = (t) => { const set = new Set([t]); for (const r of relsOf.get(t)) { set.add(r.child); set.add(r.parent); } return set; };
  function applyFocus() {
    const t = hover ?? selected;
    const near = t ? neighbours(t) : hits;
    inner.classList.toggle('focusing', Boolean(near));
    inner.classList.toggle('hover-only', !allLines.checked);
    for (const [name, node] of cards) {
      node.classList.toggle('near', Boolean(near?.has(name)));
      node.classList.toggle('selected', name === selected);
    }
    for (const row of rows.values()) row.classList.remove('hot-row');
    for (const g of svg.children) {
      const r = data.rels[g.dataset.i], hot = Boolean(t) && (r.child === t || r.parent === t);
      g.classList.toggle('hot', hot);
      if (hot) { rows.get(`${r.child}.${r.col}`)?.classList.add('hot-row'); rows.get(`${r.parent}.${r.pcol}`)?.classList.add('hot-row'); }
    }
  }

  function select(name, scroll = false) {
    selected = name;
    applyFocus();
    showPanel(name);
    if (scroll) reveal(name);
  }
  function clearSelection() { selected = null; applyFocus(); panel.classList.remove('open'); }
  stage.addEventListener('click', clearSelection);

  function reveal(name) {
    const b = box(cards.get(name));
    stage.scrollTo({ left: Math.max(0, ((b.l + b.r) / 2) * scale - stage.clientWidth / 2), top: Math.max(0, b.t * scale - 60), behavior: 'smooth' });
  }

  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    hits = q ? new Set(Object.keys(data.tables).filter((t) => t.includes(q) || data.tables[t].columns.some((c) => c.name.includes(q)))) : null;
    for (const [key, row] of rows) row.classList.toggle('match', Boolean(q) && key.split('.')[1].includes(q));
    // A match folded inside a group is opened so it can be seen, and closed again once the search
    // stops matching it. Groups the reader opened themselves are left alone.
    let moved = false;
    for (const node of cards.values()) for (const toggle of node.querySelectorAll('.group')) {
      const matches = q.length >= 2 && Boolean(toggle.nextElementSibling.querySelector('.match'));
      if (matches && toggle.nextElementSibling.hidden) { setGroup(toggle, true, true); moved = true; }
      else if (!matches && toggle.dataset.auto) { setGroup(toggle, false, false); moved = true; }
    }
    if (moved) relayout(); else applyFocus();
  });
  search.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && hits?.size) { const first = [...cards.keys()].find((t) => hits.has(t)); select(first, true); }
    if (event.key === 'Escape') { search.value = ''; search.dispatchEvent(new Event('input')); }
  });
  allLines.addEventListener('change', applyFocus);

  // ── Details panel ──
  function goto(name) { const b = el('button', { class: 'goto', type: 'button', text: name }); b.addEventListener('click', () => select(name, true)); return b; }
  function linkItem(r, outgoing) {
    const column = data.tables[r.child].columns.find((c) => c.name === r.col);
    const head = outgoing
      ? el('div', {}, el('code', { text: r.col }), ' → ', goto(r.parent), el('code', { text: `.${r.pcol}` }))
      : el('div', {}, goto(r.child), el('code', { text: `.${r.col}` }), ' → ', el('code', { text: r.pcol }));
    const kind = r.join ? 'matched, no key' : r.enforced ? 'foreign key' : 'no foreign key';
    const how = el('div', { class: 'how' }, el('span', { class: 'pill' + (r.enforced ? ' fk' : ' loose'), text: kind }));
    if (!r.join) how.append(el('span', { class: 'pill', text: column.required ? 'always set' : 'may be empty' }));
    if (r.child === r.parent) how.append(el('span', { class: 'pill', text: 'same table' }));
    return el('li', {}, head, how, r.reason ? el('div', { class: 'reason' }, inline(r.reason)) : null);
  }

  function showPanel(name) {
    const t = data.tables[name], area = areas[t.area];
    const outgoing = relsOf.get(name).filter((r) => r.child === name);
    const incoming = relsOf.get(name).filter((r) => r.parent === name);
    const close = el('button', { class: 'close', type: 'button', 'aria-label': 'Close', text: '✕' });
    close.addEventListener('click', clearSelection);
    const list = (items, out) => items.length ? el('ul', { class: 'link-list' }, ...items.map((r) => linkItem(r, out))) : el('p', { class: 'none', text: 'Nothing.' });
    const table = el('table', { class: 'cols' });
    const addRows = (cols) => {
      for (const c of cols) {
        const keys = [c.pk && 'PK', c.fk && 'FK', c.ref && 'ref', c.uk && 'UK'].filter(Boolean).join(' ');
        table.append(el('tr', {},
          el('td', {}, el('code', { text: c.name }), keys ? el('div', { class: 'note', text: keys }) : null),
          el('td', { class: 'note', text: c.type + (c.required ? '' : ', optional') }),
          el('td', { class: 'note', text: c.note ?? '' })));
      }
    };
    addRows(t.columns.filter((c) => !c.group));
    for (const group of t.groups) { table.append(el('tr', { class: 'grp' }, el('td', { colspan: '3', text: group }))); addRows(t.columns.filter((c) => c.group === group)); }
    panel.replaceChildren(
      el('div', { class: 'panel-head' }, el('h2', { text: name }), close),
      el('span', { class: 'area-tag', style: `--area: var(--a-${t.area})`, text: area.name }),
      el('p', { text: t.purpose }),
      el('h3', { text: `Points at (${outgoing.length})` }), list(outgoing, true),
      el('h3', { text: `Pointed at by (${incoming.length})` }), list(incoming, false),
      el('h3', { text: `Columns (${t.columns.length})` }), table);
    panel.classList.add('open');
    panel.scrollTop = 0;
  }

  // ── Zoom ──
  function sizeStage() { sizer.style.width = `${inner.offsetWidth * scale}px`; sizer.style.height = `${inner.offsetHeight * scale}px`; }
  function setScale(next) {
    scale = Math.min(1.6, Math.max(0.25, next));
    inner.style.transform = `scale(${scale})`;
    sizeStage();
    $('zoom-level').textContent = `${Math.round(scale * 100)}%`;
  }
  const fit = () => setScale(Math.min(1, (stage.clientWidth - 4) / inner.offsetWidth));
  function relayout() { draw(); sizeStage(); }
  $('zoom-in').addEventListener('click', () => { autoFit = false; setScale(scale * 1.25); });
  $('zoom-out').addEventListener('click', () => { autoFit = false; setScale(scale / 1.25); });
  $('zoom-100').addEventListener('click', () => { autoFit = false; setScale(1); });
  $('zoom-fit').addEventListener('click', () => { autoFit = true; fit(); });
  const header = document.querySelector('.top');
  const measureTop = () => document.documentElement.style.setProperty('--top-h', `${header.offsetHeight}px`);
  new ResizeObserver(measureTop).observe(header);
  window.addEventListener('resize', () => { if (autoFit) fit(); });
  document.addEventListener('keydown', (event) => {
    if (event.target instanceof HTMLInputElement) return;
    if (event.key === 'Escape') clearSelection();
    else if (event.key === '+' || event.key === '=') { autoFit = false; setScale(scale * 1.25); }
    else if (event.key === '-') { autoFit = false; setScale(scale / 1.25); }
    else if (event.key === '0') { autoFit = true; fit(); }
  });

  // On a phone the legend would fill the screen, so it starts folded there.
  if (matchMedia('(max-width: 640px)').matches) $('legend').open = false;
  measureTop();
  draw();
  fit();
})();
</script>
</body>
</html>
