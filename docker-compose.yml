# Local stack: PostgreSQL 18 (as on Railway), the API, and the legacy app on its
# integration/operation-backend branch, talking to that API.
#
#   docker compose up -d --build                    # db, api on :3000, legacy app on :8791
#   docker compose --profile pull run --rm pull     # copy Railway's and legacy's data into the db
#
# The db holds two databases: `operations`, the API's, and `legacy`, a copy of legacy's for
# `sync:routes`, `sync:boats` and the import to read. It listens on host port 55433: 5432 and 5433
# are often a local PostgreSQL already, and 55432 is the legacy repo's own dev database. See README,
# "Run locally with Docker".

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: operations
    ports: ["55433:5432"]
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d operations"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    # Set here, not read from .env: .env's DATABASE_URL is Railway's, and the local API must never
    # write there.
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/operations
      LOG_LEVEL: info
      # With AUTH_JWT_SECRET set every request needs a Bearer token, which `/v1/login` issues to the
      # users below: that is how the legacy app logs in. For curl, POST /v1/login as admin first.
      AUTH_REQUIRED: "false"
      AUTH_JWT_SECRET: local-development-only-not-a-real-secret
      AUTH_PASSWORD_USERS: '[{"username":"admin","password":"admin","groups":["admin"]}]'
      CORS_ORIGIN: ${LOCAL_CORS_ORIGIN:-http://localhost:8791,http://localhost:5173}
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # The legacy app from the integration worktree, as its deployment runs it: server.js serves the
  # static app and injects LA_CONFIG, and with LA_LEGACY_SYNC=false the browser never calls server.js
  # for data, only this API. So it gets no database. The worktree is mounted read-only, not built: an
  # edit there shows on reload. OPS_BACKEND_URL is what the *browser* calls, hence localhost.
  integration:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      PORT: "8791"
      LA_LEGACY_SYNC: "false"
      OPS_BACKEND_URL: http://localhost:3000
    ports: ["8791:8791"]
    volumes:
      - ${INTEGRATION_DIR:-../wt-operation-backend-integration}:/app:ro

  # One-shot: dumps both remote databases (read-only sessions) into ./.docker/dumps and restores them
  # into the local db, replacing what is there. The URLs come from .env. Runs on the postgres:18
  # image because pg_dump must be at least the server's version, and Railway runs 18.
  pull:
    image: postgres:18-alpine
    profiles: [pull]
    depends_on:
      db: { condition: service_healthy }
    environment:
      LEGACY_URL: ${ORIGINAL_DATABASE_URL:-}
      APP_URL: ${DATABASE_URL:-}
      SKIP_DUMP: ${SKIP_DUMP:-}
      PGPASSWORD: postgres
    volumes:
      - ./.docker/dumps:/dumps
      - ./scripts/db-pull.sh:/db-pull.sh:ro
    entrypoint: ["sh", "/db-pull.sh"]

volumes:
  db-data:
